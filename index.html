<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hub personal — Sebastián</title>
<style>
  :root{
    --accent:#3E6FD9;
    --teal:#14B8A6;
    --bg:#F7F8FA;
    --card:#FFFFFF;
    --text:#1F2933;
    --text-secondary:#6B7280;
    --border:#E5E7EB;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:32px 20px 48px;
  }
  header{
    text-align:center;
    margin-bottom:36px;
    max-width:480px;
  }
  header h1{
    font-size:26px;
    font-weight:700;
    letter-spacing:-0.02em;
  }
  header p{
    color:var(--text-secondary);
    font-size:15px;
    margin-top:6px;
  }
  .grid{
    width:100%;
    max-width:480px;
    display:grid;
    grid-template-columns:1fr;
    gap:16px;
  }
  a.card{
    display:flex;
    align-items:center;
    gap:16px;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    padding:22px 20px;
    text-decoration:none;
    color:var(--text);
    box-shadow:0 1px 2px rgba(0,0,0,0.04);
    transition:transform .12s ease, box-shadow .12s ease, border-color .12s ease;
  }
  a.card:active{transform:scale(0.98);}
  a.card:hover{
    box-shadow:0 4px 14px rgba(0,0,0,0.08);
    border-color:var(--accent);
  }
  .icon{
    font-size:30px;
    width:52px;
    height:52px;
    min-width:52px;
    border-radius:12px;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .icon.gastos{background:rgba(62,111,217,0.10);}
  .icon.running{background:rgba(20,184,166,0.10);}
  .card-body{flex:1;}
  .card-body h2{
    font-size:17px;
    font-weight:600;
  }
  .card-body p{
    font-size:13px;
    color:var(--text-secondary);
    margin-top:2px;
  }
  .chevron{
    color:var(--text-secondary);
    font-size:18px;
  }
  footer{
    margin-top:40px;
    font-size:12px;
    color:var(--text-secondary);
    text-align:center;
  }
</style>
</head>
<body>
  <header>
    <h1>Hub personal</h1>
    <p>Un solo link para ver y registrar todo — desde el computador o el celular.</p>
  </header>

  <div class="grid">
    <a class="card" href="/gastos/">
      <div class="icon gastos">💰</div>
      <div class="card-body">
        <h2>Gastos</h2>
        <p>Control financiero, categorías y conciliación</p>
      </div>
      <div class="chevron">›</div>
    </a>

    <a class="card" href="/running/">
      <div class="icon running">🏃</div>
      <div class="card-body">
        <h2>Running</h2>
        <p>Sesiones de trote y rutina de piernas con bandas</p>
      </div>
      <div class="chevron">›</div>
    </a>
  </div>

  <footer>Datos vivos desde Google Sheets</footer>
</body>
</html>
