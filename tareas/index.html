<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="apple-touch-icon" href="../icono-hub-180.png">
<meta name="apple-mobile-web-app-title" content="Tareas">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Tareas — Hub personal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../hub.css">
<script>
  (function(){
    var guardado = localStorage.getItem('tema-dashboard') || 'dark';
    document.documentElement.setAttribute('data-theme', guardado);
  })();
</script>
<style>
  :root{
    --bg:#0F1620;
    --surface:#172230;
    --surface-2:#1E2B3B;
    --border:#2A3A4D;
    --text:#EDEFF2;
    --muted:#8A97A6;
    --green:#4ADE94;
    --amber:#F5B942;
    --red:#F0654E;
    --blue:#6C8EEF;
    --teal:#2DD4BF;
    --accent:var(--blue);
    --card:var(--surface);
    --text-secondary:var(--muted);
  }
  :root[data-theme="light"]{
    --bg:#FAF7F2;
    --surface:#FFFFFF;
    --surface-2:#F1ECE3;
    --border:#E4DDD0;
    --text:#2B2621;
    --muted:#8C8072;
    --green:#1FA967;
    --amber:#C98A1F;
    --red:#D3392A;
    --blue:#3F63D1;
    --teal:#1F9E8C;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:var(--fuente-cuerpo),-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    padding-bottom:60px;
    transition:background .2s ease, color .2s ease;
  }
  h1,h2,h3{font-family:var(--fuente-titulo);}
  .mono{font-family:var(--fuente-numeros),monospace;}
  .theme-toggle{
    width:38px; height:38px; border-radius:20px; border:1px solid var(--border);
    background:var(--surface-2); display:flex; align-items:center; justify-content:center;
    color:var(--text); cursor:pointer; flex-shrink:0;
  }
  .theme-toggle svg{width:17px;height:17px;}
  header{
    padding:20px 16px 12px; max-width:640px; margin:0 auto;
    display:flex; justify-content:space-between; align-items:flex-start; gap:12px;
  }
  header a.back{color:var(--text-secondary); text-decoration:none; font-size:13px;}
  header h1{font-size:22px; font-weight:700; margin-top:6px;}
  main{max-width:640px; margin:0 auto; padding:0 16px 16px;}

  .franja{
    display:grid; grid-template-columns:1fr 1fr;
    background:var(--surface); border:1px solid var(--border); border-radius:14px;
    margin-bottom:18px; overflow:hidden;
  }
  .franja-item{padding:16px 18px; border-left:1px solid var(--border);}
  .franja-item:first-child{border-left:none;}
  .franja-label{font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin-bottom:6px;}
  .franja-value{font-family:var(--fuente-numeros),monospace; font-size:22px; font-weight:700;}
  .franja-value.alerta{color:var(--red);}

  .card{background:var(--card); border:1px solid var(--border); border-radius:14px; padding:14px 16px; margin-bottom:12px;}

  .tarea-row{display:flex; align-items:flex-start; gap:12px; padding:11px 0;}
  .tarea-row + .tarea-row{border-top:1px solid var(--border);}
  .check{
    width:26px; height:26px; min-width:26px; border-radius:50%; border:2px solid var(--border);
    background:var(--surface-2); cursor:pointer; display:flex; align-items:center; justify-content:center;
    color:#fff; font-size:14px; transition:background .15s ease, border-color .15s ease; flex-shrink:0; margin-top:1px;
  }
  .check.hecho{background:var(--green); border-color:var(--green);}
  .check.cargando{opacity:.5; pointer-events:none;}
  .tarea-info{flex:1; min-width:0;}
  .tarea-nombre{font-size:14.5px; font-weight:600; word-break:break-word;}
  .tarea-nombre.hecho{text-decoration:line-through; color:var(--muted);}
  .tarea-meta{display:flex; gap:6px; margin-top:5px; flex-wrap:wrap;}
  .badge{font-size:11px; font-weight:600; padding:2px 8px; border-radius:20px; background:var(--surface-2); color:var(--muted);}
  .badge.vencida{background:rgba(240,101,78,0.15); color:var(--red);}
  .badge.hoy{background:rgba(245,185,66,0.15); color:var(--amber);}
  .eliminar-btn{
    background:none; border:none; color:var(--muted); font-size:13px; cursor:pointer;
    padding:4px 2px; margin-left:2px; flex-shrink:0; margin-top:1px;
  }
  .eliminar-btn:hover{color:var(--red);}

  .settings-card{background:var(--surface-2); border:1px dashed var(--border); border-radius:14px; padding:14px 16px; margin-bottom:16px; font-size:13px;}
  .settings-card label{font-size:12.5px; font-weight:600; color:var(--text-secondary); display:block; margin-bottom:6px;}
  .settings-card input{
    width:100%; font-size:14px; padding:9px 11px; border-radius:8px; border:1px solid var(--border);
    background:var(--card); color:var(--text);
  }
  .settings-hint{font-size:11.5px; color:var(--muted); margin-top:6px;}

  .add-btn{
    font-size:14px; font-weight:600; padding:10px 14px; border-radius:8px; border:1px dashed var(--border);
    background:var(--surface-2); color:var(--text-secondary); cursor:pointer; width:100%;
  }
  .add-btn.primario{background:var(--accent); color:#fff; border:none; flex:1;}
  .add-btn.secundario{background:none; border:1px solid var(--border); color:var(--text-secondary); flex:1;}
  #formAgregar label{font-size:12.5px; font-weight:600; color:var(--text-secondary); display:block; margin:10px 0 4px;}
  #formAgregar input, #formAgregar textarea{
    width:100%; font-size:14px; padding:9px 11px; border-radius:8px; border:1px solid var(--border);
    background:var(--surface-2); color:var(--text); font-family:inherit;
  }
  #formAgregar textarea{resize:vertical; min-height:50px;}
  .form-botones{display:flex; gap:8px; margin-top:14px;}
  .calendar-hint{font-size:11px; color:var(--teal); margin-top:6px; display:flex; align-items:center; gap:4px;}

  .vacio{text-align:center; color:var(--muted); padding:20px 0; font-size:13.5px;}
  .loading{text-align:center; color:var(--text-secondary); padding:40px 0;}
  .msg{font-size:12.5px; margin-top:10px; text-align:center;}
  .msg.err{color:var(--red);}
  .msg.ok{color:var(--green);}
</style>
<link rel="manifest" href="../manifest.json">
<meta name="theme-color" content="#0F1620">
</head>
<body>
  <header>
    <div>
      <a class="back" href="../">← Hub</a>
      <h1>Tareas</h1>
    </div>
    <button class="theme-toggle" id="theme-toggle" aria-label="Cambiar tema"></button>
  </header>

  <main>
    <div id="settingsCard" class="settings-card" style="display:none;">
      <label>Token (se guarda solo en este navegador)</label>
      <input type="text" id="tokenInput" placeholder="Pega tu token una vez">
      <div class="settings-hint">Sin esto no puedes ver ni crear tareas: la lectura también requiere token.</div>
    </div>

    <div id="loading" class="loading">Cargando…</div>

    <div id="contenido" style="display:none;">
      <div class="franja">
        <div class="franja-item">
          <div class="franja-label">Pendientes</div>
          <div class="franja-value mono" id="totalPendientes">0</div>
        </div>
        <div class="franja-item">
          <div class="franja-label">Vencidas</div>
          <div class="franja-value mono" id="totalVencidas">0</div>
        </div>
      </div>

      <div class="card" id="listaTareas"></div>

      <div class="card" id="formAgregar">
        <div id="agregarCerrado">
          <button class="add-btn" id="btnAbrirAgregar">+ Agregar tarea</button>
        </div>
        <div id="agregarAbierto" style="display:none;">
          <label>Tarea</label>
          <input type="text" id="nuevaTarea" placeholder="Ej: Enviar propuesta a municipalidad">
          <label>Categoría (opcional)</label>
          <input type="text" id="nuevaCategoria" placeholder="Ej: Starbien">
          <label>Fecha límite (opcional)</label>
          <input type="date" id="nuevaFechaLimite">
          <div class="calendar-hint" id="hintCalendar" style="display:none;">📅 Se creará un evento en tu Google Calendar</div>
          <label>Notas (opcional)</label>
          <textarea id="nuevaNotas" placeholder="Detalles adicionales"></textarea>
          <div class="form-botones">
            <button class="add-btn secundario" id="btnCancelarAgregar">Cancelar</button>
            <button class="add-btn primario" id="btnGuardarAgregar">Guardar</button>
          </div>
        </div>
      </div>

      <div id="mensajeGlobal" class="msg"></div>
    </div>
  </main>

<script>
const WEBHOOK_URL = 'https://script.google.com/macros/s/AKfycbx3lZ_F9YFewjjnvCPxvYYUzhghUbK5aeNX1yUhIyKA1JDZo6Jx7UjGVK0yW_pdUERm/exec';
const TOKEN_KEY = 'sistemapersonal_webhook_token';

let TAREAS = [];

// Escapa texto antes de insertarlo como HTML, para que una tarea con texto
// malicioso en su nombre o categoría nunca pueda ejecutar código en el navegador.
function esc(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

// ---------- Tema claro/oscuro ----------
const ICONO_SOL = '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="10" cy="10" r="3.4"/><path d="M10 2v2M10 16v2M18 10h-2M4 10H2M15.5 4.5l-1.4 1.4M5.9 14.1l-1.4 1.4M15.5 15.5l-1.4-1.4M5.9 5.9L4.5 4.5"/></svg>';
const ICONO_LUNA = '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M16.5 12.3A7 7 0 018 3.5a7 7 0 106.9 8.8 6.9 6.9 0 011.6 0z"/></svg>';
function aplicarTema(tema){
  document.documentElement.setAttribute('data-theme', tema);
  document.getElementById('theme-toggle').innerHTML = tema === 'light' ? ICONO_LUNA : ICONO_SOL;
  localStorage.setItem('tema-dashboard', tema);
}
aplicarTema(localStorage.getItem('tema-dashboard') || 'dark');
document.getElementById('theme-toggle').addEventListener('click', () => {
  const actual = document.documentElement.getAttribute('data-theme') || 'dark';
  aplicarTema(actual === 'light' ? 'dark' : 'light');
});

// ---------- Token ----------
const tokenInput = document.getElementById('tokenInput');
function getToken(){ return localStorage.getItem(TOKEN_KEY) || ''; }
function actualizarVisibilidadSettings(){
  document.getElementById('settingsCard').style.display = getToken() ? 'none' : 'block';
}
tokenInput.value = getToken();
tokenInput.addEventListener('change', () => {
  localStorage.setItem(TOKEN_KEY, tokenInput.value.trim());
  actualizarVisibilidadSettings();
  cargarDatos(); // ahora que hay token, intenta cargar
});
actualizarVisibilidadSettings();

// ---------- Fechas ----------
function hoyISO(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function formatearFechaCorta(iso){
  if(!iso) return '';
  const [y,m,d] = iso.split('-');
  return d + '/' + m;
}

// ---------- Carga de datos ----------
async function cargarDatos(){
  const token = getToken();
  if(!token){
    document.getElementById('loading').textContent = 'Pega tu token arriba para ver tus tareas.';
    return;
  }
  try{
    const res = await fetch(WEBHOOK_URL + '?action=data&token=' + encodeURIComponent(token));
    const json = await res.json();
    if(!json.ok) throw new Error(json.error || 'Respuesta no ok');
    TAREAS = json.tareas || [];
    document.getElementById('loading').style.display = 'none';
    document.getElementById('contenido').style.display = 'block';
    render();
  }catch(err){
    document.getElementById('loading').style.display = 'block';
    document.getElementById('loading').textContent = 'No se pudo cargar: ' + err.message;
  }
}

function render(){
  const hoy = hoyISO();
  const lista = document.getElementById('listaTareas');
  lista.innerHTML = '';

  const ordenadas = [...TAREAS].sort((a,b) => {
    const aHecho = a.Estado === 'Hecho' ? 1 : 0;
    const bHecho = b.Estado === 'Hecho' ? 1 : 0;
    if(aHecho !== bHecho) return aHecho - bHecho;
    const fa = a.FechaLimite || '9999-99-99';
    const fb = b.FechaLimite || '9999-99-99';
    return fa.localeCompare(fb);
  });

  if(ordenadas.length === 0){
    lista.innerHTML = '<div class="vacio">Todavía no tienes tareas. Agrega la primera abajo.</div>';
  }

  let pendientes = 0, vencidas = 0;

  ordenadas.forEach(t => {
    const hecho = t.Estado === 'Hecho';
    if(!hecho){
      pendientes++;
      if(t.FechaLimite && t.FechaLimite < hoy) vencidas++;
    }

    let badgeFecha = '';
    if(t.FechaLimite){
      let clase = '';
      if(!hecho && t.FechaLimite < hoy) clase = 'vencida';
      else if(!hecho && t.FechaLimite === hoy) clase = 'hoy';
      badgeFecha = `<span class="badge ${clase}">📅 ${esc(formatearFechaCorta(t.FechaLimite))}</span>`;
    }
    const badgeCat = t.Categoria ? `<span class="badge">${esc(t.Categoria)}</span>` : '';

    const row = document.createElement('div');
    row.className = 'tarea-row';
    row.innerHTML = `
      <div class="check ${hecho ? 'hecho' : ''}" data-id="${esc(t.Id)}">${hecho ? '✓' : ''}</div>
      <div class="tarea-info">
        <div class="tarea-nombre ${hecho ? 'hecho' : ''}">${esc(t.Tarea)}</div>
        <div class="tarea-meta">${badgeFecha}${badgeCat}</div>
      </div>
      <button class="eliminar-btn" data-eliminar="${esc(t.Id)}" title="Eliminar tarea">✕</button>
    `;
    lista.appendChild(row);
  });

  document.getElementById('totalPendientes').textContent = pendientes;
  const elVencidas = document.getElementById('totalVencidas');
  elVencidas.textContent = vencidas;
  elVencidas.className = 'franja-value mono' + (vencidas > 0 ? ' alerta' : '');

  document.querySelectorAll('.check').forEach(el => {
    el.addEventListener('click', () => toggleTarea(el));
  });
  document.querySelectorAll('[data-eliminar]').forEach(el => {
    el.addEventListener('click', () => eliminarTareaUI(el.dataset.eliminar));
  });
}

async function toggleTarea(el){
  const token = getToken();
  const msg = document.getElementById('mensajeGlobal');
  if(!token){ msg.textContent = 'Pega tu token arriba antes de marcar tareas.'; msg.className = 'msg err'; return; }

  const id = el.dataset.id;
  const tarea = TAREAS.find(t => String(t.Id) === String(id));
  if(!tarea) return;
  const nuevoHecho = tarea.Estado !== 'Hecho';
  el.classList.add('cargando');

  try{
    const params = new URLSearchParams({ token, hoja:'tarea', accion:'marcar', id, hecho: String(nuevoHecho) });
    const res = await fetch(WEBHOOK_URL + '?' + params.toString());
    const json = await res.json();
    el.classList.remove('cargando');
    if(json.ok){
      tarea.Estado = nuevoHecho ? 'Hecho' : 'Pendiente';
      msg.textContent = '';
      render();
    } else {
      msg.textContent = '⚠️ ' + (json.error || 'No se pudo guardar');
      msg.className = 'msg err';
    }
  }catch(err){
    el.classList.remove('cargando');
    msg.textContent = '⚠️ No se pudo conectar.';
    msg.className = 'msg err';
  }
}

async function eliminarTareaUI(id){
  const token = getToken();
  const msg = document.getElementById('mensajeGlobal');
  if(!token){ msg.textContent = 'Pega tu token arriba antes de eliminar.'; msg.className = 'msg err'; return; }
  if(!confirm('¿Eliminar esta tarea? También se borra su evento en Calendar si tenía uno.')) return;

  try{
    const params = new URLSearchParams({ token, hoja:'tarea', accion:'eliminar', id });
    const res = await fetch(WEBHOOK_URL + '?' + params.toString());
    const json = await res.json();
    if(json.ok){
      TAREAS = TAREAS.filter(t => String(t.Id) !== String(id));
      msg.textContent = '✓ Tarea eliminada';
      msg.className = 'msg ok';
      render();
    } else {
      msg.textContent = '⚠️ ' + (json.error || 'No se pudo eliminar');
      msg.className = 'msg err';
    }
  }catch(err){
    msg.textContent = '⚠️ No se pudo conectar.';
    msg.className = 'msg err';
  }
}

// ---------- Agregar tarea ----------
const btnAbrirAgregar = document.getElementById('btnAbrirAgregar');
const btnCancelarAgregar = document.getElementById('btnCancelarAgregar');
const btnGuardarAgregar = document.getElementById('btnGuardarAgregar');
const nuevaTareaInput = document.getElementById('nuevaTarea');
const nuevaCategoriaInput = document.getElementById('nuevaCategoria');
const nuevaFechaLimiteInput = document.getElementById('nuevaFechaLimite');
const nuevaNotasInput = document.getElementById('nuevaNotas');
const hintCalendar = document.getElementById('hintCalendar');

btnAbrirAgregar.addEventListener('click', () => {
  document.getElementById('agregarCerrado').style.display = 'none';
  document.getElementById('agregarAbierto').style.display = 'block';
  nuevaTareaInput.focus();
});
btnCancelarAgregar.addEventListener('click', cerrarFormAgregar);
nuevaFechaLimiteInput.addEventListener('change', () => {
  hintCalendar.style.display = nuevaFechaLimiteInput.value ? 'flex' : 'none';
});

function cerrarFormAgregar(){
  document.getElementById('agregarAbierto').style.display = 'none';
  document.getElementById('agregarCerrado').style.display = 'block';
  nuevaTareaInput.value = '';
  nuevaCategoriaInput.value = '';
  nuevaFechaLimiteInput.value = '';
  nuevaNotasInput.value = '';
  hintCalendar.style.display = 'none';
}

btnGuardarAgregar.addEventListener('click', async () => {
  const token = getToken();
  const msg = document.getElementById('mensajeGlobal');
  if(!token){ msg.textContent = 'Pega tu token arriba primero.'; msg.className = 'msg err'; return; }
  const tarea = nuevaTareaInput.value.trim();
  if(!tarea){ msg.textContent = 'Escribe el texto de la tarea.'; msg.className = 'msg err'; return; }

  btnGuardarAgregar.disabled = true;
  try{
    const params = new URLSearchParams({
      token, hoja:'tarea', accion:'crear',
      tarea, categoria: nuevaCategoriaInput.value.trim(),
      fechaLimite: nuevaFechaLimiteInput.value, notas: nuevaNotasInput.value.trim()
    });
    const res = await fetch(WEBHOOK_URL + '?' + params.toString());
    const json = await res.json();
    btnGuardarAgregar.disabled = false;
    if(json.ok){
      cerrarFormAgregar();
      msg.textContent = '✓ Tarea agregada';
      msg.className = 'msg ok';
      await cargarDatos();
    } else {
      msg.textContent = '⚠️ ' + (json.error || 'No se pudo guardar');
      msg.className = 'msg err';
    }
  }catch(err){
    btnGuardarAgregar.disabled = false;
    msg.textContent = '⚠️ No se pudo conectar.';
    msg.className = 'msg err';
  }
});

cargarDatos();
</script>
<script>
  if('serviceWorker' in navigator){
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('../sw.js').catch(function(){});
    });
  }
</script>
</body>
</html>
